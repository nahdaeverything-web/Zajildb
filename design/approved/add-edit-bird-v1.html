<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زاجل — إضافة أو تعديل طائر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#128C6E; --brand-deep:#0E6F57; --brand-tint:#E3F4EE;
    --ink:#101820; --ink-2:#4A5560; --ink-3:#8C97A2;
    --page:#F5F7F8; --surface:#FFFFFF; --line:#E4E9ED;
    --gold:#C9971F; --gold-tint:#FBF3DF; --danger:#C43D2B;
    --r:20px; --r-btn:16px;
    --f:'Alexandria', system-ui, sans-serif;
    --f-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:var(--f); color:var(--ink); background:#E9EDF0;
        min-height:100vh; display:flex; justify-content:center; line-height:1.5; }
  .phone{ width:100%; max-width:430px; min-height:100vh; background:var(--page); position:relative; }

  .top{ background:var(--surface); padding:16px 20px 0; }
  .top .bar{ display:flex; align-items:center; justify-content:space-between; }
  .icon-btn{ width:46px; height:46px; border:none; border-radius:14px; cursor:pointer;
             background:var(--page); color:var(--ink); display:grid; place-items:center; }
  .icon-btn svg{ width:22px; height:22px; stroke:currentColor; stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .crumb{ font-size:15px; font-weight:700; color:var(--ink-3); }
  .spacer{ width:46px; }

  .formhead{ background:var(--surface); padding:14px 20px 24px; border-bottom:1px solid var(--line); }
  .formhead h1{ font-size:42px; font-weight:900; line-height:1.05; }
  .formhead p{ font-size:15px; font-weight:600; color:var(--ink-2); margin-top:8px; }

  .body{ padding:4px 20px 168px; }
  .seclbl{ font-size:22px; font-weight:900; margin:26px 0 14px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px; }

  .photo{ display:flex; align-items:center; gap:16px; padding-bottom:20px; border-bottom:1px solid var(--line); }
  .photo button{ flex:none; width:92px; height:92px; border-radius:var(--r); border:1px solid var(--line);
                 background:var(--brand-tint); display:grid; place-items:center; cursor:pointer; }
  .photo button svg{ width:28px; height:28px; stroke:var(--brand); stroke-width:2.6; fill:none; stroke-linecap:round; }
  .photo .t{ font-size:17px; font-weight:800; }
  .photo p{ font-size:13.5px; font-weight:500; color:var(--ink-2); margin-top:4px; text-wrap:pretty; }

  .field{ margin-top:20px; }
  .field > label{ display:block; font-size:13.5px; font-weight:800; color:var(--ink-2); margin-bottom:8px; }
  .field input, .field textarea{ width:100%; border:2px solid var(--line); border-radius:var(--r-btn); padding:17px 16px;
        font-family:var(--f); font-size:16px; font-weight:600; background:var(--page); color:var(--ink); outline:none; min-height:58px; }
  .field input:focus, .field textarea:focus{ border-color:var(--brand); background:var(--surface); outline:3px solid transparent; }
  .field input.data{ font-family:var(--f-mono); font-weight:600; direction:ltr; text-align:right; letter-spacing:1px; }
  .field input.warn{ border-color:var(--gold); background:var(--surface); }
  .field input.err, .field textarea.err{ border-color:var(--danger); background:var(--surface); }
  .err-msg{ font-size:13px; font-weight:700; color:var(--danger); margin-top:8px; }

  .warnbox{ background:var(--gold-tint); border:1px solid var(--gold); border-radius:var(--r-btn); padding:14px 16px; margin-top:10px; }
  .warnbox .t{ font-size:13px; font-weight:800; color:var(--ink); }
  .warnbox p{ font-size:14px; font-weight:600; color:var(--ink); margin-top:4px; text-wrap:pretty; }
  .warnbox button{ margin-top:10px; border:none; background:none; padding:0; cursor:pointer;
                   font-family:var(--f); font-size:13.5px; font-weight:800; color:var(--brand-deep); text-decoration:underline; }

  .seg{ display:flex; gap:6px; }
  .seg button{ flex:1; border:1px solid var(--line); background:var(--page); padding:15px 2px; cursor:pointer;
               font-family:var(--f); font-size:14.5px; font-weight:700; color:var(--ink-2); border-radius:999px; min-height:52px; }
  .seg button[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:#fff; }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chips button{ border:1px solid var(--line); background:var(--page); color:var(--ink-2); border-radius:999px;
                 padding:12px 18px; cursor:pointer; font-family:var(--f); font-size:14px; font-weight:700; min-height:46px; }
  .chips button[aria-pressed="true"]{ background:var(--brand); border-color:var(--brand); color:#fff; }

  .prow{ width:100%; text-align:start; background:var(--surface); border:1px solid var(--line); border-radius:18px;
         padding:16px; margin-bottom:10px; display:flex; align-items:center; gap:14px; cursor:pointer; font-family:var(--f); }
  .prow .dot{ flex:none; width:52px; height:52px; border-radius:16px; background:var(--brand-tint); display:grid; place-items:center; }
  .prow .dot svg{ width:30px; height:30px; }
  .prow .mid{ flex:1; min-width:0; }
  .prow .role{ display:block; font-size:12px; font-weight:700; color:var(--ink-3); }
  .prow .nm{ display:block; font-size:19px; font-weight:800; margin-top:2px; }
  .prow .act{ flex:none; font-size:13.5px; font-weight:800; color:var(--brand-deep); }

  .pempty{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:10px; }
  .pempty .head{ display:flex; align-items:center; gap:14px; }
  .pempty .dot{ flex:none; width:52px; height:52px; border-radius:16px; background:var(--page); display:grid; place-items:center; }
  .pempty .dot svg{ width:24px; height:24px; stroke:var(--ink-3); stroke-width:2.6; fill:none; stroke-linecap:round; }
  .pempty .role{ font-size:12px; font-weight:700; color:var(--ink-3); }
  .pempty .nm{ font-size:19px; font-weight:800; margin-top:2px; color:var(--ink-3); }
  .pempty .btns{ display:flex; gap:8px; margin-top:14px; }
  .pempty .btns button{ flex:1; border-radius:var(--r-btn); padding:14px 8px; font-family:var(--f);
                        font-size:15px; font-weight:800; cursor:pointer; min-height:50px; }
  .pempty .primary{ border:2px solid var(--ink); background:transparent; color:var(--ink); }
  .pempty .ghost{ border:1px solid var(--line); background:var(--page); color:var(--ink-2); }

  .toggle-card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px; display:flex; align-items:center; gap:14px; }
  .toggle-card .mid{ flex:1; min-width:0; }
  .toggle-card .t{ font-size:16px; font-weight:800; }
  .toggle-card p{ font-size:13.5px; font-weight:500; color:var(--ink-2); margin-top:4px; text-wrap:pretty; }
  .switch{ flex:none; width:56px; height:32px; border-radius:999px; border:none; cursor:pointer; padding:3px;
           display:flex; justify-content:flex-start; background:var(--line); }
  .switch span{ width:26px; height:26px; border-radius:999px; background:var(--surface); display:block; }
  .switch[aria-checked="true"]{ background:var(--ink); justify-content:flex-end; }

  .notes{ width:100%; min-height:130px; border:2px solid var(--line); border-radius:var(--r); padding:17px 16px;
          font-family:var(--f); font-size:16px; font-weight:600; background:var(--surface); color:var(--ink); outline:none; resize:vertical; }
  .notes:focus{ border-color:var(--brand); }

  .actions{ position:fixed; bottom:0; inset-inline:0; margin-inline:auto; max-width:430px; background:var(--surface);
            border-top:1px solid var(--line); padding:14px 20px 22px; z-index:10; }
  .actions .inner{ display:flex; gap:10px; }
  .actions .cancel{ flex:none; border:2px solid var(--ink); background:transparent; color:var(--ink); border-radius:var(--r-btn);
                    padding:17px 24px; font-family:var(--f); font-size:16px; font-weight:800; cursor:pointer; }
  .actions .save{ flex:1; border:none; border-radius:var(--r-btn); padding:17px; background:var(--brand); color:#fff;
                  font-family:var(--f); font-size:17px; font-weight:800; cursor:pointer; }

  .rail{ display:none; position:fixed; top:0; bottom:0; inset-inline-end:0; width:132px; background:var(--surface);
         border-inline-start:1px solid var(--line); flex-direction:column; gap:4px; padding:24px 12px; z-index:11; }
  .rail button{ display:flex; align-items:center; gap:10px; border:none; background:none; cursor:pointer; color:var(--ink-3);
                font-family:var(--f); font-size:13px; font-weight:700; padding:12px 10px; border-radius:14px; min-height:48px; }
  .rail button svg{ width:26px; height:26px; stroke:currentColor; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .rail button.on{ background:var(--brand-tint); color:var(--brand); }

  /* desktop — Part 3 */
  @media (hover:hover){
    .prow:hover, .rail button:hover{ background:var(--brand-tint); }
    .actions .save:hover{ background:var(--brand-deep); }
    .actions .cancel:hover, .pempty .primary:hover{ background:var(--ink); color:#fff; }
    .photo button:hover{ border-color:var(--brand); }
  }
  .icon-btn:focus-visible, .seg button:focus-visible, .chips button:focus-visible,
  .prow:focus-visible, .switch:focus-visible, .actions button:focus-visible{ outline:3px solid var(--brand); outline-offset:2px; }
  @media (min-width:701px){
    .phone{ max-width:660px; border-inline:1px solid var(--line); }
    .col{ max-width:560px; margin-inline:auto; }
    .actions{ max-width:660px; }
    .actions .inner{ max-width:560px; margin-inline:auto; }
  }
  @media (min-width:1100px){
    .rail{ display:flex; }
    .phone{ margin-inline-end:132px; }
    .actions{ margin-inline-end:calc(50% - 330px + 132px); margin-inline-start:calc(50% - 330px); }
  }
</style>
</head>
<body>
<div class="phone">
<div class="col">

  <div class="top"><div class="bar">
    <button class="icon-btn" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <span class="crumb">الطيور</span>
    <span class="spacer"></span>
  </div></div>

  <header class="formhead">
    <h1>إضافة طائر</h1>
    <p>لوفت الفحيص · موسم 2026 / 2027</p>
  </header>

  <div class="body">

    <div class="seclbl">الأساسيات</div>
    <div class="card">

      <div class="photo">
        <button aria-label="إضافة صورة"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <div>
          <div class="t">إضافة صورة</div>
          <p>تُحفظ الصورة على هذا الجهاز.</p>
        </div>
      </div>

      <div class="field">
        <label for="f-name">الاسم</label>
        <input id="f-name" value="رعد" placeholder="مثال: رعد">
      </div>

      <div class="field">
        <label for="f-ring">رقم الحلقة</label>
        <input id="f-ring" class="data warn" dir="ltr" value="JOR 24 17360" placeholder="JOR 26 00000">
        <div class="warnbox">
          <div class="t">رقم حلقة مكرر</div>
          <p>هذا الرقم مسجل لطائر آخر: شقراء. يمكنك المتابعة والحفظ.</p>
          <button type="button">عرض الطائر</button>
        </div>
      </div>

      <div class="field">
        <label>الجنس</label>
        <div class="seg" data-single>
          <button type="button" aria-pressed="true">ذكر</button>
          <button type="button" aria-pressed="false">أنثى</button>
          <button type="button" aria-pressed="false">غير معروف</button>
        </div>
      </div>

      <div class="field">
        <label>الحالة</label>
        <div class="chips" data-single>
          <button type="button" aria-pressed="true">نشط</button>
          <button type="button" aria-pressed="false">تربية</button>
          <button type="button" aria-pressed="false">فريق السباق</button>
          <button type="button" aria-pressed="false">ميت</button>
          <button type="button" aria-pressed="false">مباع</button>
          <button type="button" aria-pressed="false">مفقود</button>
        </div>
      </div>

      <div class="field">
        <label for="f-color">اللون والوصف</label>
        <input id="f-color" value="أزرق مخطط" placeholder="مثال: أزرق مخطط">
      </div>

      <div class="field">
        <label for="f-date">تاريخ التفقيس</label>
        <input id="f-date" class="data" dir="ltr" value="12 / 04 / 2026" placeholder="DD / MM / YYYY">
      </div>
    </div>

    <div class="seclbl">النسب</div>

    <button class="prow" type="button">
      <span class="dot"><svg viewBox="0 0 100 100" fill="#128C6E"><path d="M18 78c14 4 34 4 46-4 10-7 16-18 17-30 0-4-2-6-5-6-2 0-4 1-5 3l-4 8c-6 10-16 16-28 18-8 1-15 5-21 11z"/><path d="M62 34c3-6 9-9 15-8 3 0 5 2 5 5 0 2-1 3-3 4l-6 2c-4 2-8 1-11-3z"/><path d="M80 36l8 2-8 2z"/></svg></span>
      <span class="mid">
        <span class="role">الأب</span>
        <span class="nm">الصاعقة</span>
        <span class="plate sm" style="display:inline-flex; align-items:stretch; direction:ltr; border-radius:10px; overflow:hidden; background:var(--ink); margin-top:6px;">
          <span style="background:var(--gold); color:#fff; font-family:var(--f-mono); font-weight:600; font-size:10px; padding:0 7px; display:grid; place-items:center;">21</span>
          <span style="color:#fff; font-family:var(--f-mono); font-weight:600; font-size:12px; letter-spacing:1px; padding:6px 10px;">JOR 21 08841</span>
        </span>
      </span>
      <span class="act">تغيير</span>
    </button>

    <div class="pempty">
      <div class="head">
        <span class="dot"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
        <div>
          <div class="role">الأم</div>
          <div class="nm">لم تُحدَّد</div>
        </div>
      </div>
      <div class="btns">
        <button type="button" class="primary">اختيار من اللوفت</button>
        <button type="button" class="ghost">إنشاء سريع</button>
      </div>
    </div>

    <div class="toggle-card">
      <div class="mid">
        <div class="t">سلف خارج اللوفت</div>
        <p>سجل مرجعي للنسب فقط — لا يظهر في قائمة الطيور ولا في السباقات.</p>
      </div>
      <button class="switch" type="button" role="switch" aria-checked="false" aria-label="سلف خارج اللوفت"><span></span></button>
    </div>

    <div class="seclbl">ملاحظات</div>
    <textarea class="notes" placeholder="سلالة، مصدر الطائر، ملاحظات التدريب…"></textarea>

  </div>
</div>

<div class="actions"><div class="inner">
  <button class="cancel" type="button">إلغاء</button>
  <button class="save" type="button">حفظ الطائر</button>
</div></div>

<nav class="rail">
  <button><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
  <button class="on"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/></svg>الطيور</button>
  <button><svg viewBox="0 0 24 24"><path d="M12 3v6M6 21v-6M18 21v-6M6 15h12M12 9c-4 0-6 2-6 6M12 9c4 0 6 2 6 6"/></svg>الأنساب</button>
  <button><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>السباقات</button>
  <button><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>المزيد</button>
</nav>

</div>

<script>
  document.querySelectorAll('[data-single]').forEach(group => {
    group.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
      group.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    }));
  });
  const sw = document.querySelector('.switch');
  sw.addEventListener('click', () => sw.setAttribute('aria-checked', sw.getAttribute('aria-checked') === 'true' ? 'false' : 'true'));
</script>
</body>
</html>
